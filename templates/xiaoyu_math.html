<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 小渔的数学学习</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
    min-height: 100vh;
    padding: 20px;
}
.container { max-width: 1000px; margin: 0 auto; }

.back-link { color: #1565c0; text-decoration: none; font-size: 14px; margin-bottom: 16px; display: inline-block; }
.back-link:hover { text-decoration: underline; }

header {
    background: white;
    border-radius: 16px;
    padding: 24px 30px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
header h1 { font-size: 24px; color: #1565c0; }
header .sub { font-size: 13px; color: #888; margin-top: 4px; }
header .stats { display: flex; gap: 24px; margin-top: 12px; font-size: 13px; }
header .stats span { color: #666; }
header .stats .num { font-weight: 700; color: #1565c0; }

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
}
.tab {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    transition: all 0.15s;
}
.tab:hover { background: rgba(255,255,255,0.9); }
.tab.active { background: white; color: #1565c0; box-shadow: 0 2px 8px rgba(21,101,192,0.15); }

.content-area { display: none; }
.content-area.active { display: block; }

.glass-card {
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
}

/* 错题列表 */
.error-item {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #f0f0f0;
    align-items: flex-start;
}
.error-item:last-child { border-bottom: none; }
.error-item .idx {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: #e3f2fd;
    color: #1565c0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
}
.error-item .info { flex: 1; }
.error-item .info .question { font-size: 15px; color: #333; margin-bottom: 4px; }
.error-item .info .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.error-item .info .tags .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #f0f0f0;
    color: #666;
}
.error-item .info .tags .tag.difficulty-1 { background: #e8f5e9; color: #2e7d32; }
.error-item .info .tags .tag.difficulty-2 { background: #fff3e0; color: #e65100; }
.error-item .info .tags .tag.difficulty-3 { background: #fce4ec; color: #c62828; }
.error-item .answer { font-size: 13px; color: #999; }
.error-item .answer .correct { color: #2e7d32; }
.error-item .answer .wrong { color: #c62828; }

.add-form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
.add-form input, .add-form textarea, .add-form select {
    padding: 10px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
}
.add-form input:focus, .add-form textarea:focus { border-color: #1565c0; }
.add-form .q-input { flex: 1; min-width: 200px; }
.add-form .btn-add {
    background: #1565c0;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
}
.add-form .btn-add:hover { opacity: 0.9; }

.empty { text-align: center; padding: 40px; color: #bbb; }
.empty .icon { font-size: 48px; }

.search-box {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    margin-bottom: 14px;
}
.search-box:focus { border-color: #1565c0; }

@media (max-width: 640px) {
    .tabs { overflow-x: auto; }
    .add-form input, .add-form textarea { min-width: 100%; }
}
</style>
</head>
<body>
<div class="container">
    <a href="/xiaoyu" class="back-link">‹ 返回小渔首页</a>

    <header>
        <h1>📐 小渔的数学学习</h1>
        <div class="sub">数学错题本 · 在线题库</div>
        <div class="stats">
            <span>📝 错题 <span class="num" id="errCount">0</span></span>
            <span>✅ 已掌握 <span class="num" id="masteredCount">0</span></span>
            <span>🏷️ 分类 <span class="num" id="categoryCount">0</span></span>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('errors')">📝 错题本</button>
        <button class="tab" onclick="switchTab('practice')">✏️ 在线练习</button>
        <button class="tab" onclick="switchTab('stats')">📊 学习统计</button>
    </div>

    <!-- 错题本 -->
    <div class="content-area active" id="tab-errors">
        <div class="glass-card">
            <h5 class="mb-3">➕ 添加错题</h5>
            <div class="add-form">
                <input type="text" class="q-input" id="qTitle" placeholder="题目名称，如：分数加减法第3题">
                <select id="qCategory">
                    <option value="加减法">加减法</option>
                    <option value="乘除法">乘除法</option>
                    <option value="分数">分数</option>
                    <option value="小数">小数</option>
                    <option value="几何">几何</option>
                    <option value="应用题">应用题</option>
                    <option value="其他">其他</option>
                </select>
                <select id="qDifficulty">
                    <option value="1">⭐ 简单</option>
                    <option value="2" selected>⭐⭐ 中等</option>
                    <option value="3">⭐⭐⭐ 困难</option>
                </select>
                <button class="btn-add" onclick="addError()">➕ 添加</button>
            </div>
        </div>

        <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索错题…" oninput="renderErrors()">

        <div class="glass-card">
            <h5 class="mb-3">📝 错题列表</h5>
            <div id="errorList"></div>
        </div>
    </div>

    <!-- 在线练习 -->
    <div class="content-area" id="tab-practice">
        <div class="glass-card" style="text-align:center;padding:40px;">
            <div class="icon" style="font-size:48px;margin-bottom:12px;">🎯</div>
            <h5>随机出题</h5>
            <p style="color:#888;font-size:14px;margin:8px 0;">从错题本中随机抽题练习</p>
            <button class="btn-add" style="background:#e91e63;" onclick="startPractice()">🎯 开始练习</button>
            <div id="practiceArea" style="margin-top:20px;display:none;"></div>
        </div>
    </div>

    <!-- 学习统计 -->
    <div class="content-area" id="tab-stats">
        <div class="glass-card">
            <h5 class="mb-3">📊 学习统计</h5>
            <div id="statsArea" style="text-align:center;padding:20px;color:#888;">
                加载中…
            </div>
        </div>
    </div>
</div>

<script>
let errors = [];

async function loadErrors() {
    try {
        const res = await fetch('/api/xiaoyu/math-errors');
        const data = await res.json();
        errors = data.errors || [];
        renderErrors();
        updateStats();
    } catch (e) { console.error(e); }
}

function renderErrors() {
    const q = (document.getElementById('searchBox').value || '').toLowerCase();
    const filtered = q ? errors.filter(e => (e.title || '').toLowerCase().includes(q) || (e.category || '').toLowerCase().includes(q)) : errors;

    const el = document.getElementById('errorList');
    if (filtered.length === 0) {
        el.innerHTML = '<div class="empty"><div class="icon">📝</div><div>' + (q ? '没有匹配的错题' : '还没有错题记录，加油不放弃 💪') + '</div></div>';
        return;
    }
    el.innerHTML = filtered.map((e, i) => {
        const diff = parseInt(e.difficulty) || 1;
        const diffLabel = ['','简单','中等','困难'][diff] || '中等';
        return `<div class="error-item">
            <div class="idx">${i+1}</div>
            <div class="info">
                <div class="question">${escapeHtml(e.title)}</div>
                <div class="tags">
                    <span class="tag">${escapeHtml(e.category || '未分类')}</span>
                    <span class="tag difficulty-${diff}">${diffLabel}</span>
                    <span class="tag">${e.mastered ? '✅ 已掌握' : '🔄 待复习'}</span>
                </div>
            </div>
            <div>
                <button class="btn btn-sm btn-outline-success" onclick="toggleMaster(${e.id})" title="标记掌握/未掌握">${e.mastered ? '↩️' : '✅'}</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteError(${e.id})" title="删除">🗑️</button>
            </div>
        </div>`;
    }).join('');
    document.getElementById('errCount').textContent = errors.length;
    document.getElementById('masteredCount').textContent = errors.filter(e => e.mastered).length;
}

function updateStats() {
    const cats = {};
    errors.forEach(e => {
        const c = e.category || '未分类';
        if (!cats[c]) cats[c] = 0;
        cats[c]++;
    });
    document.getElementById('categoryCount').textContent = Object.keys(cats).length;

    const statsEl = document.getElementById('statsArea');
    const mastered = errors.filter(e => e.mastered).length;
    const rate = errors.length ? Math.round(mastered / errors.length * 100) : 0;
    statsEl.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:500px;margin:0 auto;">
            <div style="background:#e3f2fd;border-radius:12px;padding:16px;">
                <div style="font-size:24px;font-weight:700;color:#1565c0;">${errors.length}</div>
                <div style="font-size:12px;color:#666;">总错题</div>
            </div>
            <div style="background:#e8f5e9;border-radius:12px;padding:16px;">
                <div style="font-size:24px;font-weight:700;color:#2e7d32;">${mastered}</div>
                <div style="font-size:12px;color:#666;">已掌握</div>
            </div>
            <div style="background:#fff3e0;border-radius:12px;padding:16px;">
                <div style="font-size:24px;font-weight:700;color:#e65100;">${rate}%</div>
                <div style="font-size:12px;color:#666;">掌握率</div>
            </div>
        </div>
        <div style="margin-top:16px;font-size:13px;color:#888;">
            ${Object.entries(cats).map(([c, n]) => `<span style="margin:0 6px;">${c}: ${n}题</span>`).join(' | ')}
        </div>
    `;
}

async function addError() {
    const title = document.getElementById('qTitle').value.trim();
    if (!title) { alert('请输入题目名称'); return; }
    const category = document.getElementById('qCategory').value;
    const difficulty = parseInt(document.getElementById('qDifficulty').value);
    try {
        const res = await fetch('/api/xiaoyu/math-errors', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, category, difficulty})
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('qTitle').value = '';
            await loadErrors();
        } else { alert('添加失败'); }
    } catch (e) { alert('添加失败: ' + e.message); }
}

async function toggleMaster(id) {
    try {
        await fetch('/api/xiaoyu/math-errors/' + id + '/toggle', {method: 'POST'});
        await loadErrors();
    } catch (e) { alert('操作失败'); }
}

async function deleteError(id) {
    if (!confirm('确定删除？')) return;
    try {
        await fetch('/api/xiaoyu/math-errors/' + id, {method: 'DELETE'});
        await loadErrors();
    } catch (e) { alert('删除失败'); }
}

function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.content-area').forEach(a => a.classList.remove('active'));
    const tabBtn = [...document.querySelectorAll('.tab')].find(t => t.textContent.includes(name === 'errors' ? '错题本' : name === 'practice' ? '在线练习' : '学习统计'));
    if (tabBtn) tabBtn.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
}

function startPractice() {
    const area = document.getElementById('practiceArea');
    area.style.display = 'block';
    const unsolved = errors.filter(e => !e.mastered);
    if (unsolved.length === 0) {
        area.innerHTML = '<div style="padding:20px;color:#888;">🎉 全部掌握！太棒了！</div>';
        return;
    }
    const q = unsolved[Math.floor(Math.random() * unsolved.length)];
    area.innerHTML = `
        <div style="background:#f5f5f5;border-radius:12px;padding:20px;">
            <div style="font-size:13px;color:#888;margin-bottom:8px;">📝 待复习 (${unsolved.length}题)</div>
            <div style="font-size:18px;font-weight:600;color:#333;">${escapeHtml(q.title)}</div>
            <div style="margin-top:8px;font-size:13px;color:#888;">${q.category || '未分类'} · ${['','简单','中等','困难'][q.difficulty]}</div>
            <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;">
                <button class="btn btn-sm btn-success" onclick="markPracticeCorrect(${q.id})">✅ 做对了</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="startPractice()">🎲 换一题</button>
            </div>
        </div>
    `;
}

async function markPracticeCorrect(id) {
    await toggleMaster(id);
    startPractice();
}

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

loadErrors();
</script>
</body>
</html>
