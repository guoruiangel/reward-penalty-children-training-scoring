<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 小渔的作业</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #e1bee7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .top-bar h1 {
            font-size: 20px;
            color: #6a1b9a;
        }
        .top-bar .back-link {
            color: #7b1fa2;
            text-decoration: none;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(123,31,162,0.08);
            transition: all 0.2s;
        }
        .top-bar .back-link:hover {
            background: rgba(123,31,162,0.15);
        }
        
        .main-container {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        
        .sidebar {
            width: 260px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0,0,0,0.06);
            overflow-y: auto;
            flex-shrink: 0;
            padding: 16px 0;
        }
        .sidebar .nav-item {
            padding: 12px 20px;
            color: #4a148c;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar .nav-item:hover {
            background: rgba(123,31,162,0.06);
        }
        .sidebar .nav-item.active {
            background: rgba(123,31,162,0.1);
            border-left-color: #7b1fa2;
            font-weight: 600;
            color: #6a1b9a;
        }
        .sidebar .nav-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        
        .content-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: rgba(255,255,255,0.5);
        }
        .content-area iframe {
            width: 100%;
            height: calc(100vh - 80px);
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .content-area .page-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            min-height: calc(100vh - 120px);
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/xiaoyu" class="back-link">‹ 返回小渔</a>
        <h1>📚 小渔的作业</h1>
    </div>
    <div class="main-container">
        <div class="sidebar" id="navSidebar">
            <div class="nav-item active" data-page="wiki">
                <span class="icon">📖</span>
                <span>三年级下册语文知识点总结</span>
            </div>
        </div>
        <div class="content-area" id="contentArea">
            <div class="page-content" id="pageContent">
                <p style="color:#888; text-align:center; padding-top:60px;">正在加载...</p>
            </div>
        </div>
    </div>
    <script>
        const pages = {
            'wiki': {
                title: '三年级下册语文知识点总结',
                url: '/static/%E4%B8%89%E4%B8%8B%E8%AF%AD%E6%96%87%E7%9F%A5%E8%AF%86%E7%82%B9.pdf'
            }
        };

        function loadPage(pageKey) {
            const page = pages[pageKey];
            if (!page) return;
            
            // 更新导航高亮
            document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.sidebar .nav-item[data-page="${pageKey}"]`)?.classList.add('active');
            
            // 显示内容
            const contentArea = document.getElementById('contentArea');
            if (page.url.endsWith('.pdf')) {
                contentArea.innerHTML = `<iframe src="${page.url}" title="${page.title}"></iframe>`;
            } else {
                contentArea.innerHTML = `<div class="page-content"><iframe src="${page.url}" style="width:100%;height:calc(100vh - 120px);border:none;border-radius:12px;"></iframe></div>`;
            }
        }

        // 导航点击事件
        document.getElementById('navSidebar').addEventListener('click', function(e) {
            const item = e.target.closest('.nav-item');
            if (item) {
                loadPage(item.dataset.page);
            }
        });

        // 默认加载
        loadPage('wiki');
    </script>
</body>
</html>
