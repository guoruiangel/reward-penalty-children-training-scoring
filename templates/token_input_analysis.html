<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 录入与分析 - Pablo 系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
        }
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .header-card {
            background: linear-gradient(135deg, var(--primary-color), #a855f7);
            color: white;
        }
        .rule-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .list-group-item {
            border: none;
            border-bottom: 1px solid #f3f4f6;
            padding: 12px 16px;
        }
        .list-group-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- 头部 -->
        <div class="glass-card header-card mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mb-2"><i class="bi bi-input-cursor me-2"></i>Token 录入与分析</h1>
                    <p class="mb-0 opacity-90">记录每日Token消耗，查看评分规则</p>
                </div>
                <div>
                    <a href="/scoring-rules-editor" class="btn btn-warning me-2">
                        <i class="bi bi-gear me-1"></i>编排打分规则
                    </a>
                    <a href="/" class="btn btn-outline-light">
                        <i class="bi bi-house-door me-1"></i>返回主页
                    </a>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 左侧：Token录入 -->
            <div class="col-lg-6">
                <div class="glass-card">
                    <h4 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Token 录入</h4>
                    
                    <!-- 简单总Token录入窗口 -->
                    <div class="card border-primary mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-lightning-charge me-2"></i>快速录入总Token消耗
                        </div>
                        <div class="card-body">
                            <p class="text-muted small mb-3">只需输入日期和总Token数，系统自动记录</p>
                            
                            <div class="mb-3">
                                <label for="totalTokensDate" class="form-label">日期 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="totalTokensDate" required>
                                <div class="form-text">选择Token消耗的日期</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="totalTokensSimple" class="form-label">总Token数 (M) <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="number" class="form-control form-control-lg" id="totalTokensSimple" 
                                           placeholder="例如：15" min="0.1" step="0.1" required>
                                    <span class="input-group-text">M tokens</span>
                                </div>
                                <div class="form-text">输入该日期消耗的总Token数量，单位为百万(M)。例如：15 表示 15,000,000 tokens</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="totalTokensNotes" class="form-label">备注说明（可选）</label>
                                <textarea class="form-control" id="totalTokensNotes" rows="2" 
                                          placeholder="例如：主要进行了代码开发和API测试"></textarea>
                            </div>
                            
                            <button class="btn btn-success btn-lg w-100" onclick="submitTotalTokens()">
                                <i class="bi bi-save me-2"></i>保存Token消耗记录
                            </button>
                            
                            <div id="totalTokensResult" class="mt-3"></div>
                        </div>
                    </div>
                    
                    <!-- 原有的详细录入表单 -->
                    <div class="mt-4 pt-4 border-top">
                        <h5 class="mb-3"><i class="bi bi-sliders me-2"></i>详细录入（可选）</h5>
                        <form id="tokenForm">
                            <div class="mb-3">
                                <label class="form-label">日期</label>
                                <input type="date" class="form-control" id="dateInput" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">输入 Tokens</label>
                                <input type="number" class="form-control" id="inputTokens" placeholder="输入消耗的tokens数量" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">输出 Tokens</label>
                                <input type="number" class="form-control" id="outputTokens" placeholder="输入输出的tokens数量">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">描述（可选）</label>
                                <input type="text" class="form-control" id="description" placeholder="例如：日报任务、股票分析等">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-save me-2"></i>保存记录
                            </button>
                        </form>
                        <div id="saveResult" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- 右侧：评分规则 -->
            <div class="col-lg-6">
                <div class="glass-card">
                    <h4 class="mb-3"><i class="bi bi-award me-2"></i>评分规则</h4>
                    
                    <!-- 奖励规则 -->
                    <div class="mb-4">
                        <h5 class="text-success mb-3"><i class="bi bi-trophy me-2"></i>奖励规则</h5>
                        <div id="rewardRulesList" class="list-group">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-success" role="status"></div>
                                <p class="text-muted mt-2">正在加载奖励规则...</p>
                            </div>
                        </div>
                    </div>

                    <!-- 中性规则 -->
                    <div class="mb-4">
                        <h5 class="text-secondary mb-3"><i class="bi bi-dash-circle me-2"></i>中性规则</h5>
                        <div id="neutralRulesList" class="list-group">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
                                <p class="text-muted mt-2">正在加载中性规则...</p>
                            </div>
                        </div>
                    </div>

                    <!-- 扣分规则 -->
                    <div class="mb-4">
                        <h5 class="text-danger mb-3"><i class="bi bi-exclamation-triangle me-2"></i>扣分规则</h5>
                        <div id="penaltyRulesList" class="list-group">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-danger" role="status"></div>
                                <p class="text-muted mt-2">正在加载扣分规则...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近记录 -->
        <div class="glass-card">
            <h4 class="mb-3"><i class="bi bi-clock-history me-2"></i>最近记录</h4>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>输入Tokens</th>
                            <th>输出Tokens</th>
                            <th>总计</th>
                            <th>描述</th>
                            <th>预估得分</th>
                        </tr>
                    </thead>
                    <tbody id="recentRecords">
                        <tr><td colspan="6" class="text-center py-3">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 设置默认日期为今天
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

        // 加载评分规则
        async function loadScoringRules() {
            try {
                const response = await fetch('/api/scoring-rules');
                const data = await response.json();
                
                if (data.status === 'success') {
                    renderRules(data.data);
                } else {
                    showDefaultRules();
                }
            } catch (error) {
                console.error('加载评分规则失败:', error);
                showDefaultRules();
            }
        }

        // 渲染规则
        function renderRules(rules) {
            const rewardRules = rules.filter(r => r.rule_name === '奖励规则' && r.is_active && r.score > 0);
            const neutralRules = rules.filter(r => r.rule_name === '中性规则' && r.is_active);
            const penaltyRules = rules.filter(r => r.rule_name === '扣分规则' && r.is_active && r.score < 0);

            renderRuleList('rewardRulesList', rewardRules, 'success', '+');
            renderRuleList('neutralRulesList', neutralRules, 'secondary', '');
            renderRuleList('penaltyRulesList', penaltyRules, 'danger', '');
        }

        function renderRuleList(elementId, rules, badgeClass, prefix) {
            const container = document.getElementById(elementId);
            if (!container) return;

            if (rules.length === 0) {
                container.innerHTML = '<div class="text-center py-3 text-muted">暂无规则</div>';
                return;
            }

            container.innerHTML = '';
            rules.forEach(rule => {
                const rangeText = getRangeText(rule.min_value, rule.max_value);
                const item = document.createElement('div');
                item.className = 'list-group-item';
                item.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <span>${rangeText}</span>
                        <span class="badge bg-${badgeClass}">${prefix}${rule.score}分</span>
                    </div>
                    ${rule.description ? `<small class="text-muted">${rule.description}</small>` : ''}
                `;
                container.appendChild(item);
            });
        }

        function getRangeText(min, max) {
            if (min !== null && max !== null) return `${min}M - ${max}M tokens`;
            if (min !== null) return `> ${min}M tokens`;
            if (max !== null) return `< ${max}M tokens`;
            return '所有范围';
        }

        // 默认规则
        function showDefaultRules() {
            document.getElementById('rewardRulesList').innerHTML = `
                <div class="list-group-item"><div class="d-flex justify-content-between"><span>< 0.01M tokens</span><span class="badge bg-success">+10分</span></div></div>
                <div class="list-group-item"><div class="d-flex justify-content-between"><span>0.01-0.05M tokens</span><span class="badge bg-success">+5分</span></div></div>
                <div class="list-group-item"><div class="d-flex justify-content-between"><span>0.05-0.1M tokens</span><span class="badge bg-success">+3分</span></div></div>
            `;
            document.getElementById('neutralRulesList').innerHTML = `
                <div class="list-group-item"><div class="d-flex justify-content-between"><span>0.1-5M tokens</span><span class="badge bg-secondary">0分</span></div></div>
            `;
            document.getElementById('penaltyRulesList').innerHTML = `
                <div class="list-group-item"><div class="d-flex justify-content-between"><span>5-10M tokens</span><span class="badge bg-danger">-3分</span></div></div>
                <div class="list-group-item"><div class="d-flex justify-content-between"><span>> 10M tokens</span><span class="badge bg-danger">-10分</span></div></div>
            `;
        }

        // 保存Token记录
        document.getElementById('tokenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const date = document.getElementById('dateInput').value;
            const inputTokens = parseInt(document.getElementById('inputTokens').value) || 0;
            const outputTokens = parseInt(document.getElementById('outputTokens').value) || 0;
            const description = document.getElementById('description').value;
            const totalTokens = inputTokens + outputTokens;

            try {
                const response = await fetch('/api/tokens/record', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        date: date,
                        input_tokens: inputTokens,
                        output_tokens: outputTokens,
                        total_tokens: totalTokens,
                        description: description,
                        task_name: description || '手动录入',
                        category: 'other'
                    })
                });

                const result = await response.json();
                const resultDiv = document.getElementById('saveResult');

                if (result.success) {
                    resultDiv.innerHTML = `<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>记录已保存！预估得分: ${result.score || 0}分</div>`;
                    document.getElementById('tokenForm').reset();
                    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
                    loadRecentRecords();
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger"><i class="bi bi-x-circle me-2"></i>保存失败: ${result.error || '未知错误'}</div>`;
                }
            } catch (error) {
                document.getElementById('saveResult').innerHTML = `<div class="alert alert-danger">保存失败: ${error.message}</div>`;
            }
        });

        // 加载最近记录
        async function loadRecentRecords() {
            try {
                const response = await fetch('/api/tokens/records?page=1&per_page=20');
                const data = await response.json();

                if (data.success) {
                    const tbody = document.getElementById('recentRecords');
                    if (data.data.records.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3 text-muted">暂无记录</td></tr>';
                        return;
                    }

                    tbody.innerHTML = data.data.records.map(r => `
                        <tr>
                            <td>${r.date}</td>
                            <td>${r.input_tokens?.toLocaleString() || '-'}</td>
                            <td>${r.output_tokens?.toLocaleString() || '-'}</td>
                            <td class="fw-bold">${r.total_tokens?.toLocaleString()}</td>
                            <td>${r.description || '-'}</td>
                            <td>${r.score !== null && r.score !== undefined ? `<span class="badge bg-${r.score > 0 ? 'success' : r.score < 0 ? 'danger' : 'secondary'}">${r.score > 0 ? '+' : ''}${r.score}分</span>` : '-'}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('recentRecords').innerHTML = `<tr><td colspan="6" class="text-center py-3 text-danger">加载失败: ${error.message}</td></tr>`;
            }
        }

        // 简单总Token录入函数
        async function submitTotalTokens() {
            const date = document.getElementById('totalTokensDate').value;
            const totalTokensM = parseFloat(document.getElementById('totalTokensSimple').value) || 0;
            const notes = document.getElementById('totalTokensNotes').value.trim();
            
            if (!date) {
                showTotalTokensResult('请选择日期', 'danger');
                return;
            }
            
            if (!totalTokensM || totalTokensM <= 0) {
                showTotalTokensResult('请输入有效的总Token数', 'danger');
                return;
            }
            
            // 将M转换为实际token数（乘以1,000,000）
            const totalTokens = Math.round(totalTokensM * 1000000);
            
            const resultDiv = document.getElementById('totalTokensResult');
            resultDiv.innerHTML = '<div class="alert alert-info">保存中...</div>';
            
            try {
                // 使用我们之前创建的API端点
                const response = await fetch('/api/tokens/record-daily', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        date: date,
                        total_tokens: totalTokens,
                        development_tokens: Math.floor(totalTokens * 0.4),  // 40% 开发
                        search_tokens: Math.floor(totalTokens * 0.3),      // 30% 搜索
                        communication_tokens: Math.floor(totalTokens * 0.2), // 20% 沟通
                        other_tokens: totalTokens - Math.floor(totalTokens * 0.4) - Math.floor(totalTokens * 0.3) - Math.floor(totalTokens * 0.2), // 剩余10%
                        notes: notes || '快速录入总Token消耗',
                        distribution_method: 'simple'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 保存成功后，重新计算该日期的分数
                    await recalculateScoreForDate(date, totalTokensM, totalTokens);
                    
                    // 清空表单（保留日期）
                    document.getElementById('totalTokensSimple').value = '';
                    document.getElementById('totalTokensNotes').value = '';
                    
                    // 重新加载最近记录
                    loadRecentRecords();
                } else {
                    showTotalTokensResult(`❌ 保存失败: ${result.error || '未知错误'}`, 'danger');
                }
            } catch (error) {
                showTotalTokensResult(`❌ 提交失败: ${error.message}`, 'danger');
            }
        }
        
        function showTotalTokensResult(message, type) {
            const resultDiv = document.getElementById('totalTokensResult');
            const alertClass = type === 'success' ? 'alert-success' : type === 'danger' ? 'alert-danger' : 'alert-info';
            resultDiv.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
        }
        
        // 重新计算指定日期的分数
        async function recalculateScoreForDate(date, tokensM, totalTokens) {
            try {
                const response = await fetch('/api/scores/recalculate-date', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        date: date
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 显示分数更新结果
                    let scoreMessage = `✅ Token消耗记录保存成功！<br>日期: ${date}<br>总Token: ${tokensM}M (${totalTokens.toLocaleString()})`;
                    
                    if (result.old_score !== null && result.old_score !== undefined) {
                        scoreMessage += `<br>分数更新: ${result.old_score}分 → ${result.score}分`;
                    } else {
                        scoreMessage += `<br>新分数: ${result.score}分`;
                    }
                    
                    scoreMessage += `<br>当前总分: ${result.total_score}分`;
                    
                    showTotalTokensResult(scoreMessage, 'success');
                    
                    // 更新页面上的总分显示（如果有的话）
                    updateTotalScoreDisplay(result.total_score);
                } else {
                    // 如果重新计算失败，只显示保存成功
                    showTotalTokensResult(`✅ Token消耗记录保存成功！<br>日期: ${date}<br>总Token: ${tokensM}M (${totalTokens.toLocaleString()})<br>注意：分数重新计算失败: ${result.error}`, 'warning');
                }
            } catch (error) {
                // 如果重新计算失败，只显示保存成功
                showTotalTokensResult(`✅ Token消耗记录保存成功！<br>日期: ${date}<br>总Token: ${tokensM}M (${totalTokens.toLocaleString()})<br>注意：分数重新计算失败: ${error.message}`, 'warning');
            }
        }
        
        // 更新总分显示
        function updateTotalScoreDisplay(totalScore) {
            // 尝试更新页面上的总分显示
            const scoreElements = document.querySelectorAll('[id*="score"], [class*="score"]');
            scoreElements.forEach(element => {
                if (element.textContent.includes('分') || element.id.includes('score')) {
                    element.textContent = `当前总分: ${totalScore}分`;
                }
            });
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
            document.getElementById('totalTokensDate').value = today;
            
            loadScoringRules();
            loadRecentRecords();
        });
    </script>
</body>
</html>
