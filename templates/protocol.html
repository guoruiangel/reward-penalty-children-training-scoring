<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo ↔ Pbee 协作协议</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root { --primary: #7c3aed; --secondary: #a855f7; }
        body { background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #e0e0e0; }
        .header { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 20px 0; }
        .header a { color: var(--secondary); text-decoration: none; }
        .header a:hover { color: var(--primary); }
        .protocol-section { border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 20px; transition: all 0.3s; }
        .protocol-section:hover { border-color: rgba(255,255,255,0.15); }
        .section-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid rgba(124,58,237,0.4); }
        .section-content { white-space: pre-wrap; line-height: 1.8; color: #d1d5db; }
        .badge-pablo { background: rgba(124,58,237,0.25); color: #c084fc; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .badge-pbee { background: rgba(16,185,129,0.25); color: #6ee7b7; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .confirm-row { display: flex; gap: 40px; justify-content: center; margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container d-flex align-items-center">
            <a href="/"><i class="bi bi-arrow-left"></i> 返回主页</a>
            <span class="ms-3 me-2"><i class="bi bi-file-text-fill" style="color:var(--secondary)"></i></span>
            <span style="font-size:1.2rem;font-weight:700;color:#fff;">Pablo ↔ Pbee 协作协议</span>
            <span class="ms-3 badge-pablo">Pablo</span>
            <span class="ms-1 badge-pbee">Pbee</span>
            <span class="ms-auto" style="color:#6b7280;font-size:0.85rem;">最后更新: 2026-04-25</span>
        </div>
    </div>
    <div class="container py-4">
        {% for section in protocol_sections %}
        <div class="protocol-section">
            <div class="section-title"><i class="bi bi-journal-text me-2" style="color:var(--secondary)"></i>{{ section.section }}</div>
            <div class="section-content">{{ section.content }}</div>
        </div>
        {% endfor %}
        
        <div class="confirm-row">
            <div style="text-align:center">
                <i class="bi bi-check-circle-fill" style="color:#6ee7b7;font-size:1.5rem;"></i>
                <div class="mt-2" style="color:#9ca3af">Pablo 已确认</div>
                <div style="color:var(--secondary);font-size:0.9rem">2026-04-25</div>
            </div>
            <div style="text-align:center">
                <i class="bi bi-check-circle-fill" style="color:#6ee7b7;font-size:1.5rem;"></i>
                <div class="mt-2" style="color:#9ca3af">Pbee 已确认</div>
                <div style="color:var(--secondary);font-size:0.9rem">2026-04-25</div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/conversations" class="btn btn-outline-light btn-sm">
                <i class="bi bi-chat-dots"></i> 查看对话记录
            </a>
        </div>
    </div>
</body>
</html>
