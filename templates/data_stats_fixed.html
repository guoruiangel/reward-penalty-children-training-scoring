<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计分析 - Pablo 系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #06b6d4;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 24px;
        }
        
        .header-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }
        
        .stat-trend {
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .trend-up {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .trend-down {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .trend-neutral {
            background: rgba(156, 163, 175, 0.2);
            color: #9ca3af;
        }
        
        .time-period-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .time-period-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .time-period-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .export-btn {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .export-btn:hover {
            background: #0da271;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: white;
            font-weight: 600;
        }
        
        p, span, div {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .text-primary { color: var(--primary-color) !important; }
        .text-success { color: var(--success-color) !important; }
        .text-warning { color: var(--warning-color) !important; }
        .text-danger { color: var(--danger-color) !important; }
        .text-info { color: var(--info-color) !important; }
        
        .bg-primary { background-color: var(--primary-color) !important; }
        .bg-success { background-color: var(--success-color) !important; }
        .bg-warning { background-color: var(--warning-color) !important; }
        .bg-danger { background-color: var(--danger-color) !important; }
        .bg-info { background-color: var(--info-color) !important; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 头部 -->
        <div class="glass-card header-card mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mb-2">
                        <i class="bi bi-graph-up-arrow me-2"></i>数据统计分析
                    </h1>
                    <p class="mb-0 opacity-90">Token消耗监控、趋势分析、优化建议</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="btn-group" role="group">
                        <button type="button" class="time-period-btn active" data-period="7d">7天</button>
                        <button type="button" class="time-period-btn" data-period="30d">30天</button>
                        <button type="button" class="time-period-btn" data-period="90d">90天</button>
                        <button type="button" class="time-period-btn" data-period="all">全部</button>
                    </div>
                    <a href="/" class="btn btn-outline-light">
                        <i class="bi bi-house-door me-1"></i>返回主页
                    </a>
                    <button class="export-btn">
                        <i class="bi bi-download me-2"></i>导出报告
                    </button>
                </div>
            </div>
        </div>

        <!-- 关键指标 -->
        <div class="glass-card mb-4">
            <h3 class="mb-4">
                <i class="bi bi-speedometer2 me-2"></i>关键指标概览
            </h3>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-value text-primary">加载中...</div>
                    <div class="stat-label">总Token消耗</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-info">加载中...</div>
                    <div class="stat-label">日均消耗</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-success">加载中...</div>
                    <div class="stat-label">活跃天数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-warning">加载中...</div>
                    <div class="stat-label">单日峰值</div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="row">
            <div class="col-lg-8">
                <div class="glass-card">
                    <h3 class="mb-4">
                        <i class="bi bi-bar-chart-line me-2"></i>Token消耗趋势
                    </h3>
                    <div class="chart-container">
                        <canvas id="tokenTrendChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="glass-card">
                    <h3 class="mb-4">
                        <i class="bi bi-pie-chart me-2"></i>分类占比
                    </h3>
                    <div class="chart-container">
                        <canvas id="categoryPieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 详细记录 -->
        <div class="glass-card mt-4">
            <h3 class="mb-4">
                <i class="bi bi-table me-2"></i>详细记录
            </h3>
            <div class="table-container">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>任务</th>
                            <th>分类</th>
                            <th>输入</th>
                            <th>输出</th>
                            <th>总计</th>
                            <th>描述</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4">加载中...</td>
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div id="tableInfo" class="text-muted">显示 0-0 条，共 0 条记录</div>
                    <div>
                        <button class="btn btn-sm btn-outline-light me-2" id="prevPage">上一页</button>
                        <button class="btn btn-sm btn-outline-light" id="nextPage">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/data_stats_simple_fix.js"></script>
    <script>
        // 额外调试
        console.log('页面HTML加载完成');
        window.addEventListener('load', function() {
            console.log('页面完全加载');
        });
    </script>
</body>
</html>
