<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日报 - 直接数据库查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .date-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 180px;
            height: 100vh;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 15px;
        }
        .content-area {
            margin-left: 180px;
            padding: 20px;
        }
        .date-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            margin-bottom: 5px;
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .date-btn:hover {
            background: #f8f9fa;
            border-color: #0d6efd;
        }
        .date-btn.active {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>
    <!-- 左侧日期栏 -->
    <div class="date-sidebar">
        <div class="mb-3">
            <a href="/" class="btn btn-outline-primary btn-sm w-100">
                <i class="bi bi-house-door me-1"></i> 返回主页
            </a>
        </div>
        <h6>日期</h6>
        <div id="dateList">
            <div class="text-muted">加载中...</div>
        </div>
    </div>
    
    <!-- 右侧内容区 -->
    <div class="content-area">
        <h3>日报 <span id="currentDate" class="badge bg-secondary">选择日期</span></h3>
        
        <div id="dailyContent">
            <div class="alert alert-info">
                从左侧选择日期查看日报（直接数据库查询）
            </div>
        </div>
    </div>
    
    <script>
        // 直接调用后端API获取日期列表
        fetch('/api/daily/dates')
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    renderDateList(data.dates);
                    if (data.dates.length > 0) {
                        loadDate(data.dates[0]);
                    }
                }
            });
        
        function renderDateList(dates) {
            const dateList = document.getElementById('dateList');
            dateList.innerHTML = '';
            
            dates.forEach(date => {
                const btn = document.createElement('button');
                btn.className = 'date-btn';
                btn.textContent = formatDate(date);
                btn.onclick = () => loadDate(date);
                dateList.appendChild(btn);
            });
        }
        
        function loadDate(date) {
            document.getElementById('currentDate').textContent = formatDate(date);
            
            // 直接调用修复后的API
            fetch(`/api/daily/direct/${date}`)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderDailyContent(data);
                    } else {
                        document.getElementById('dailyContent').innerHTML = `
                            <div class="alert alert-danger">
                                ${data.message || '加载失败'}
                            </div>
                        `;
                    }
                })
                .catch(() => {
                    document.getElementById('dailyContent').innerHTML = `
                        <div class="alert alert-danger">
                            网络错误，请刷新重试
                        </div>
                    `;
                });
        }
        
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${d.getMonth()+1}月${d.getDate()}日`;
        }
        
        function renderDailyContent(data) {
            const container = document.getElementById('dailyContent');
            
            let html = '';
            
            // 天气
            if (data.weather && data.weather.length > 0) {
                const w = data.weather[0];
                html += `
                    <div class="card mb-3">
                        <div class="card-header bg-info text-white">
                            <i class="bi bi-cloud-sun me-2"></i>天气
                        </div>
                        <div class="card-body">
                            <h5>${w.location || '廊坊'}</h5>
                            <p>${w.temperature || '-'}°C | ${w.condition || '-'}</p>
                            <p>湿度 ${w.humidity || '-'}% | ${w.wind_speed || '-'} km/h</p>
                        </div>
                    </div>
                `;
            }
            
            // 股票
            if (data.stocks && data.stocks.length > 0) {
                html += `
                    <div class="card mb-3">
                        <div class="card-header bg-success text-white">
                            <i class="bi bi-graph-up me-2"></i>股票 (${data.stocks.length}只)
                        </div>
                        <div class="card-body">
                `;
                
                data.stocks.forEach((item, i) => {
                    const changeClass = (item.change_percent || 0) >= 0 ? 'text-success' : 'text-danger';
                    const changeText = item.change_percent ? `${item.change_percent}%` : '';
                    
                    html += `
                        <div class="${i > 0 ? 'border-top pt-2 mt-2' : ''}">
                            <h6>${item.symbol || ''} ${item.name || ''}</h6>
                            <p>价格: <strong>${item.price || '-'}</strong> 
                                <span class="${changeClass}">${changeText}</span>
                            </p>
                            <p>${item.analysis || '无分析'}</p>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            // 新闻
            if (data.news && data.news.length > 0) {
                html += `
                    <div class="card mb-3">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-newspaper me-2"></i>新闻 (${data.news.length}条)
                        </div>
                        <div class="card-body">
                `;
                
                data.news.forEach((item, i) => {
                    html += `
                        <div class="${i > 0 ? 'border-top pt-2 mt-2' : ''}">
                            <h6>${item.title || '无标题'}</h6>
                            <p>${item.content || '无内容'}</p>
                            <small class="text-muted">${item.source || '未知来源'}</small>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            // 改进报告
            if (data.improvements && data.improvements.length > 0) {
                html += `
                    <div class="card mb-3">
                        <div class="card-header bg-warning text-dark">
                            <i class="bi bi-lightbulb me-2"></i>改进报告 (${data.improvements.length}条)
                        </div>
                        <div class="card-body">
                `;
                
                data.improvements.forEach((item, i) => {
                    html += `
                        <div class="${i > 0 ? 'border-top pt-2 mt-2' : ''}">
                            <h6>${item.title || '报告'}</h6>
                            <p>${item.content || '无内容'}</p>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            if (!html) {
                html = '<div class="alert alert-warning">该日期无日报数据</div>';
            }
            
            container.innerHTML = html;
        }
    </script>
</body>
</html>
