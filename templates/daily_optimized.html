<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日摘要 - Pablo 系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #06b6d4;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 20px;
        }
        
        .header-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        
        /* 优化后的天气卡片 */
        .weather-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .weather-temp {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            line-height: 1;
        }
        
        .weather-condition {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 4px;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        
        .weather-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .weather-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px;
        }
        
        .weather-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .weather-value {
            font-size: 1rem;
            font-weight: 600;
            color: white;
        }
        
        .weather-forecast {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* 新闻卡片 */
        .news-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            transition: transform 0.2s;
        }
        
        .news-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .news-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .news-content {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 12px;
        }
        
        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        /* 股票卡片 */
        .stock-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .stock-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
        }
        
        .stock-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        
        .stock-change {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
        }
        
        .change-up {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .change-down {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .stock-analysis {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-top: 8px;
        }
        
        .stock-prediction {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--primary-color);
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
        }
        
        /* 通用样式 */
        .btn-outline-primary {
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .btn-outline-primary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: white;
            font-weight: 600;
        }
        
        p, span, div {
            color: rgba(255, 255, 255, 0.9);
        }
        
        .text-primary { color: var(--primary-color) !important; }
        .text-success { color: var(--success-color) !important; }
        .text-warning { color: var(--warning-color) !important; }
        .text-danger { color: var(--danger-color) !important; }
        .text-info { color: var(--info-color) !important; }
        
        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .filter-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        
        .empty-state i {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 头部 -->
        <div class="glass-card header-card mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mb-2">
                        <i class="bi bi-newspaper me-2"></i>每日摘要
                    </h1>
                    <p class="mb-0 opacity-90">新闻摘要、股票信息、天气报告每日沉淀</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <a href="/" class="btn btn-outline-primary">
                        <i class="bi bi-house-door me-1"></i>返回主页
                    </a>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="glass-card mb-4">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label text-white mb-2">选择日期</label>
                        <input type="date" class="form-control bg-transparent text-white border-light" id="dateFilter" value="2026-03-29">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label text-white mb-2">内容类型</label>
                        <select class="form-select bg-transparent text-white border-light" id="typeFilter">
                            <option value="all">全部内容</option>
                            <option value="news">仅新闻</option>
                            <option value="stocks">仅股票</option>
                            <option value="weather">仅天气</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label text-white mb-2">来源筛选</label>
                        <select class="form-select bg-transparent text-white border-light" id="sourceFilter">
                            <option value="all">全部来源</option>
                            <option value="news-skill">新闻技能</option>
                            <option value="stock-analysis">股票分析</option>
                            <option value="weather">天气</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <button class="btn btn-primary" id="applyFilter">
                    <i class="bi bi-funnel me-1"></i>应用筛选
                </button>
                <button class="btn btn-outline-light" id="todayBtn">
                    <i class="bi bi-calendar-check me-1"></i>今天
                </button>
            </div>
        </div>

        <!-- 数据容器 -->
        <div id="dataContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-light" role="status">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <p class="mt-3 text-white">正在加载数据...</p>
            </div>
        </div>
    </div>

    <script src="/static/daily_optimized.js"></script>
    <script>
        // 全局变量
        let dailyData = {
            news: [],
            stocks: [],
            weather: null,
            date: ''
        };
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            console.log('日报页面初始化');
            
            // 设置默认日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateFilter').value = today;
            
            // 绑定事件
            document.getElementById('applyFilter').addEventListener('click', applyFilter);
            document.getElementById('todayBtn').addEventListener('click', goToToday);
            
            // 初始加载
            loadDailyData(today);
        });
        
        // 加载日报数据
        async function loadDailyData(date) {
            try {
                console.log('加载日报数据:', date);
                
                // 显示加载状态
                document.getElementById('dataContainer').innerHTML = `
                    <div class="text-center py-5">
                        <div class="spinner-border text-light" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                        <p class="mt-3 text-white">正在加载数据...</p>
                    </div>
                `;
                
                // 调用API
                const response = await fetch(`/api/daily/${date}`);
                const result = await response.json();
                
                console.log('API返回结果:', result.status, '新闻数量:', result.news?.length, '股票数量:', result.stocks?.length);
                
                if (result.status === 'success') {
                    dailyData = {
                        news: result.news || [],
                        stocks: result.stocks || [],
                        weather: result.weather || null,
                        date: date
                    };
                    
                    console.log('数据加载完成，准备渲染');
                    renderData();
                } else {
                    console.error('API返回错误:', result.message);
                    throw new Error(result.message || 'API返回错误');
                }
            } catch (error) {
                console.error('加载数据失败:', error);
                showError('加载数据失败: ' + error.message);
            }
        }
        
        // 渲染数据
        function renderData() {
            const container = document.getElementById('dataContainer');
            const typeFilter = document.getElementById('typeFilter').value;
            const sourceFilter = document.getElementById('sourceFilter').value;
            
            let html = '';
            
            // 1. 天气信息（如果存在且未被筛选掉）
            if (dailyData.weather && typeFilter !== 'stocks' && sourceFilter !== 'stocks') {
                html += renderWeatherCard(dailyData.weather);
            }
            
            // 2. 新闻内容
            const filteredNews = dailyData.news.filter(item => {
                if (typeFilter === 'stocks') return false;
                if (sourceFilter === 'stocks') return false;
                if (sourceFilter !== 'all' && item.source !== sourceFilter) return false;
                return true;
            });
            
            if (filteredNews.length > 0) {
                html += `
                    <div class="glass-card">
                        <h4 class="mb-4">
                            <i class="bi bi-newspaper me-2"></i>新闻摘要
                            <span class="badge bg-light text-dark ms-2">${filteredNews.length}条</span>
                        </h4>
                `;
                
                filteredNews.forEach((news, index) => {
                    html += renderNewsCard(news, index);
                });
                
                html += `</div>`;
            }
            
            // 3. 股票信息
            const filteredStocks = dailyData.stocks.filter(item => {
                if (typeFilter === 'news') return false;
                if (sourceFilter === 'news') return false;
                return true;
            });
            
            if (filteredStocks.length > 0) {
                html += `
                    <div class="glass-card">
                        <h4 class="mb-4">
                            <i class="bi bi-graph-up me-2"></i>股票信息
                            <span class="badge bg-light text-dark ms-2">${filteredStocks.length}只</span>
                        </h4>
                `;
                
                filteredStocks.forEach((stock, index) => {
                    html += renderStockCard(stock, index);
                });
                
                html += `</div>`;
            }
            
            // 4. 空状态
            if (html === '') {
                html = `
                    <div class="glass-card">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <h4 class="mt-3">暂无数据</h4>
                            <p class="text-muted">请选择其他日期或筛选条件</p>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            console.log('数据渲染完成');
        }
        
        // 渲染天气卡片（优化版，占地减小一半）
        function renderWeatherCard(weather) {
            return `
                <div class="weather-card">
                    <div class="weather-main">
                        <div>
                            <div class="weather-temp">${weather.temperature}°C</div>
                            <div class="weather-condition">${weather.condition}</div>
                            <div class="small text-white-50 mt-1">${weather.location}</div>
                        </div>
                        <div class="text-end">
                            <div class="small text-white-50">更新时间</div>
                            <div class="text-white">${formatTime(weather.updated_at)}</div>
                        </div>
                    </div>
                    
                    <div class="weather-details">
                        <div class="weather-item">
                            <div class="weather-icon">
                                <i class="bi
