<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内网设备管理 - Pablo 系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --success-color: #10b981;
        }
        
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            max-width: 1400px;
            padding: 20px;
        }
        
        .header-card {
            background: linear-gradient(135deg, var(--primary-color), #a855f7);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        
        .btn-scan {
            background: linear-gradient(135deg, var(--success-color), #0ea5e9);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            color: white;
        }
        
        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        
        .btn-scan:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        .device-status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-online { background-color: var(--success-color); }
        .status-offline { background-color: #9ca3af; }
        
        /* 备注编辑样式 */
        .notes-container {
            position: relative;
            min-height: 30px;
            cursor: pointer;
        }
        
        .notes-container:hover .edit-notes-btn {
            display: inline-block !important;
        }
        
        .edit-notes-btn {
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        
        .notes-container:hover .edit-notes-btn {
            opacity: 1;
        }
        
        .notes-text {
            display: inline-block;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        
        .notes-text:hover {
            background-color: #f0f0f0;
        }
        
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .header-card { padding: 15px; }
            .header-card h1 { font-size: 1.2rem; }
            .header-card .lead { font-size: 0.85rem; }
            .header-card .btn { font-size: 0.75rem; padding: 4px 8px; }
            .btn-scan { padding: 6px 10px; font-size: 0.75rem; }
            .btn-group .btn { font-size: 0.7rem; padding: 3px 6px; }
            .card-title { font-size: 1rem; }
            .input-group { max-width: 100% !important; }
            
            /* 表头隐藏非核心列 */
            /* 手机端卡片式设备列表 */
            .table-responsive table,
            .table-responsive thead,
            .table-responsive tbody,
            .table-responsive tr { display: block; }
            .table-responsive thead { display: none; }
            .table-responsive tr {
                background: white;
                border-radius: 8px;
                margin-bottom: 8px;
                padding: 10px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08);
                border: 1px solid #eee;
            }
            .table-responsive td {
                display: block !important;
                border: none !important;
                padding: 2px 0 !important;
                font-size: 0.85rem;
                line-height: 1.6;
                max-width: none !important;
                overflow: visible !important;
                white-space: normal !important;
            }
            .table-responsive td:before {
                content: attr(data-label);
                font-weight: 600;
                color: #6c757d;
                display: inline-block;
                width: 65px;
                font-size: 0.75rem;
            }
        }
        
        /* 有备注的设备 - 绿色背景 */
        .notes-text:not(:empty):not([title="点击添加备注"]) {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        /* 备注编辑模态框 */
        .notes-modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1040;
        }
        
        .notes-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 1050;
            min-width: 400px;
            max-width: 500px;
            width: 90%;
        }
        

        
        /* 设备分类标签 */
        .category-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 5px;
        }
        
        .category-online {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .category-offline {
            background-color: rgba(156, 163, 175, 0.1);
            color: #6b7280;
            border: 1px solid rgba(156, 163, 175, 0.2);
        }
        
        .category-unknown {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部卡片 -->
        <div class="header-card">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="display-6 fw-bold mb-2">
                        <i class="bi bi-wifi me-3"></i>内网设备管理
                    </h1>
                    <p class="lead mb-0">监控和管理本地网络中的设备状态</p>
                </div>
                <div class="col-md-4 text-end">
                    <a href="/" class="btn btn-outline-primary me-2">
                        <i class="bi bi-house-door me-1"></i>返回主页
                    </a>
                    <div class="btn-group">
                        <button class="btn btn-scan" onclick="networkController?.start('quick')" id="quickScanBtn">
                            <i class="bi bi-lightning me-1"></i>快速检查
                        </button>
                        <button class="btn btn-scan" onclick="networkController?.start('full')" id="fullScanBtn">
                            <i class="bi bi-radar me-1"></i>完整扫描
                        </button>
                    </div>
                    <a href="/network/schedule" class="btn btn-outline-light ms-2" title="定时扫描设置">
                        <i class="bi bi-clock me-1"></i>定时设置
                    </a>
                    <div class="mt-2">
                        <small class="text-white-50">
                            <i class="bi bi-clock-history me-1"></i>
                            最后扫描: <span id="lastScanTime">--</span>
                            <span class="ms-2" id="scanTimer"></span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 设备表格 -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">
                    <i class="bi bi-pc-display me-2"></i>网络设备列表
                    <span class="badge bg-primary ms-2" id="deviceCount">0</span>
                    <small class="text-muted ms-3">
                        <i class="bi bi-info-circle"></i> 点击备注列可编辑设备备注
                    </small>
                </h5>
                
                <!-- 设备分类筛选 -->
                <div class="row mb-2 g-1">
                    <div class="col-12 col-md-8">
                        <div class="btn-group btn-group-sm flex-wrap" role="group" style="gap:2px;">
                            <button type="button" class="btn btn-outline-primary active" data-filter="all">全部</button>
                            <button type="button" class="btn btn-outline-success" data-filter="online">在线</button>
                            <button type="button" class="btn btn-outline-secondary" data-filter="offline">离线</button>
                            <button type="button" class="btn btn-outline-warning" data-filter="unknown">未知</button>
                        </div>
                    </div>
                    <div class="col-12 col-md-4 mt-1 mt-md-0">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="deviceSearch" placeholder="搜索...">
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th width="40">状态</th>
                                <th>设备名称</th>
                                <th>IP地址</th>
                                <th>MAC地址</th>
                                <th>厂商</th>
                                <th>最后在线</th>
                                <th>在线次数</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody id="devicesTable">
                            <!-- 设备数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>
                
                <div class="text-center text-muted py-3" id="loadingMessage">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    正在加载设备数据...
                </div>
            </div>
        </div>
    </div>
    
    <!-- 备注编辑模态框 -->
    <div class="notes-modal-backdrop" id="notesBackdrop" onclick="hideNotesModal()"></div>
    <div class="notes-modal" id="notesModal">
        <h5>
            <i class="bi bi-pencil-square me-2"></i>编辑设备备注
        </h5>
        <div class="mb-3">
            <label class="form-label">设备信息</label>
            <div class="form-control bg-light" id="deviceInfo" style="font-size: 14px;"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">备注内容</label>
            <textarea class="form-control" id="notesTextarea" rows="3" placeholder="请输入设备备注..."></textarea>
        </div>
        <div class="text-end">
            <button type="button" class="btn btn-secondary" onclick="hideNotesModal()">取消</button>
            <button type="button" class="btn btn-primary ms-2" onclick="saveNotes()">保存</button>
        </div>
    </div>
    

    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 网络组件库 -->
    <script src="/static/js/network_components.js"></script>
    
    <!-- 简化版网络页面JS -->
    <script src="/static/js/network_simple.js"></script>
</body>
</html>
