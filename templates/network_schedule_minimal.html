<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络扫描定时设置</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; padding: 20px; font-family: sans-serif; }
        .container { max-width: 1000px; }
        .header { background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .task-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .task-card.quick { border-left: 4px solid #10b981; }
        .task-card.full { border-left: 4px solid #3b82f6; }
        .cron-inputs { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
        .cron-input { flex: 1; min-width: 80px; }
        .preset-btns { display: flex; gap: 5px; flex-wrap: wrap; margin: 10px 0; }
        .preset-btn { padding: 5px 10px; font-size: 0.8rem; border: 1px solid #ddd; border-radius: 4px; background: #f8f9fa; }
        .test-area { background: #e8f4fd; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; }
        .enabled { background: #d1fae5; color: #065f46; }
        .disabled { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="d-flex justify-content-between">
                <div>
                    <h4><i class="bi bi-wifi"></i> 网络扫描定时设置</h4>
                    <p class="mb-0">分别配置快速扫描和完整扫描</p>
                </div>
                <div>
                    <a href="/network" class="btn btn-sm btn-outline-light">设备列表</a>
                    <a href="/" class="btn btn-sm btn-outline-light">返回主页</a>
                </div>
            </div>
        </div>
        
        <!-- 快速扫描 -->
        <div class="task-card quick">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h5 class="mb-1"><i class="bi bi-lightning text-success"></i> 快速扫描</h5>
                    <small class="text-muted">快速检查已知设备状态</small>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="quickEnabled">
                    <label class="form-check-label"><span id="quickStatus">启用</span></label>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">执行时间</label>
                <div class="cron-inputs">
                    <div class="cron-input">
                        <small>分钟</small>
                        <input type="text" class="form-control form-control-sm" id="quickMinute" value="30">
                    </div>
                    <div class="cron-input">
                        <small>小时</small>
                        <input type="text" class="form-control form-control-sm" id="quickHour" value="18">
                    </div>
                    <div class="cron-input">
                        <small>日</small>
                        <input type="text" class="form-control form-control-sm" id="quickDay" value="*">
                    </div>
                    <div class="cron-input">
                        <small>月</small>
                        <input type="text" class="form-control form-control-sm" id="quickMonth" value="*">
                    </div>
                    <div class="cron-input">
                        <small>星期</small>
                        <input type="text" class="form-control form-control-sm" id="quickWeekday" value="*">
                    </div>
                </div>
                <div class="mt-2">
                    <small>Cron表达式:</small>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control" id="quickCron" value="30 18 * * *" readonly>
                        <button class="btn btn-outline-secondary" onclick="copyCron('quick')"><i class="bi bi-clipboard"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <small>预设时间:</small>
                <div class="preset-btns">
                    <button class="preset-btn" onclick="setQuickPreset('0 9 * * *')">9:00</button>
                    <button class="preset-btn" onclick="setQuickPreset('30 18 * * *')">18:30</button>
                    <button class="preset-btn" onclick="setQuickPreset('0 22 * * *')">22:00</button>
                    <button class="preset-btn" onclick="setQuickPreset('0 * * * *')">每小时</button>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">时区</label>
                    <select class="form-select form-select-sm" id="quickTz">
                        <option value="Asia/Shanghai">上海</option>
                        <option value="Asia/Tokyo">东京</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">描述</label>
                    <input type="text" class="form-control form-control-sm" id="quickDesc" value="每日快速检查">
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <div>
                    <small>下次执行:</small>
                    <div id="quickNext" class="text-primary">计算中...</div>
                </div>
                <div>
                    <button class="btn btn-success btn-sm" onclick="saveQuick()"><i class="bi bi-save"></i> 保存</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="resetQuick()">重置</button>
                </div>
            </div>
        </div>
        
        <!-- 完整扫描 -->
        <div class="task-card full">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h5 class="mb-1"><i class="bi bi-radar text-primary"></i> 完整扫描</h5>
                    <small class="text-muted">扫描整个网络发现新设备</small>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="fullEnabled">
                    <label class="form-check-label"><span id="fullStatus">启用</span></label>
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">执行时间</label>
                <div class="cron-inputs">
                    <div class="cron-input">
                        <small>分钟</small>
                        <input type="text" class="form-control form-control-sm" id="fullMinute" value="0">
                    </div>
                    <div class="cron-input">
                        <small>小时</small>
                        <input type="text" class="form-control form-control-sm" id="fullHour" value="6">
                    </div>
                    <div class="cron-input">
                        <small>日</small>
                        <input type="text" class="form-control form-control-sm" id="fullDay" value="*">
                    </div>
                    <div class="cron-input">
                        <small>月</small>
                        <input type="text" class="form-control form-control-sm" id="fullMonth" value="*">
                    </div>
                    <div class="cron-input">
                        <small>星期</small>
                        <input type="text" class="form-control form-control-sm" id="fullWeekday" value="0">
                    </div>
                </div>
                <div class="mt-2">
                    <small>Cron表达式:</small>
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control" id="fullCron" value="0 6 * * 0" readonly>
                        <button class="btn btn-outline-secondary" onclick="copyCron('full')"><i class="bi bi-clipboard"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="mb-3">
                <small>预设时间:</small>
                <div class="preset-btns">
                    <button class="preset-btn" onclick="setFullPreset('0 6 * * 0')">周日6:00</button>
                    <button class="preset-btn" onclick="setFullPreset('0 22 * * 6')">周六22:00</button>
                    <button class="preset-btn" onclick="setFullPreset('0 2 * * *')">每天2:00</button>
                    <button class="preset-btn" onclick="setFullPreset('0 3 1 * *')">每月1日</button>
                </div>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">时区</label>
                    <select class="form-select form-select-sm" id="fullTz">
                        <option value="Asia/Shanghai">上海</option>
                        <option value="Asia/Tokyo">东京</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">描述</label>
                    <input type="text" class="form-control form-control-sm" id="fullDesc" value="每周完整扫描">
                </div>
            </div>
            
            <div class="d-flex justify-content-between">
                <div>
                    <small>下次执行:</small>
                    <div id="fullNext" class="text-primary">计算中...</div>
                </div>
                <div>
                    <button class="btn btn-primary btn-sm" onclick="saveFull()"><i class="bi bi-save"></i> 保存</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="resetFull()">重置</button>
                </div>
            </div>
        </div>
        
        <!-- 测试区域 -->
        <div class="test-area">
            <h6><i class="bi bi-play-circle"></i> 测试扫描</h6>
            <p class="text-muted mb-2">测试当前配置是否正确</p>
            <div>
                <button class="btn btn-success btn-sm" onclick="testQuick()" id="testQuickBtn">
                    <i class="bi bi-lightning"></i> 测试快速扫描
                </button>
                <button class="btn btn-primary btn-sm" onclick="testFull()" id="testFullBtn">
                    <i class="bi bi-radar"></i> 测试完整扫描
                </button>
            </div>
            <div id="testResult" class="mt-3" style="display:none;">
                <div class="d-flex gap-3">
                    <div class="text-center">
                        <div class="fs-5" id="testOnline">0</div>
                        <small>在线设备</small>
                    </div>
                    <div class="text-center">
                        <div class="fs-5" id="testDevices">0</div>
                        <small>发现设备</small>
                    </div>
                    <div class="text-center">
                        <div class="fs-5" id="testTime">0s</div>
                        <small>扫描耗时</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            loadSchedules();
            
            // 监听输入变化
            ['quick', 'full'].forEach(type => {
                ['Minute', 'Hour', 'Day', 'Month', 'Weekday'].forEach(field => {
                    document.getElementById(type + field).addEventListener('input', () => updateCron(type));
                });
            });
            
            // 监听开关
            document.getElementById('quickEnabled').addEventListener('change', function() {
                document.getElementById('quickStatus').textContent = this.checked ? '启用' : '禁用';
                document.getElementById('quickStatus').className = this.checked ? 'status-badge enabled' : 'status-badge disabled';
            });
            
            document.getElementById('fullEnabled').addEventListener('change', function() {
                document.getElementById('fullStatus').textContent = this.checked ? '启用' : '禁用';
                document.getElementById('fullStatus').className = this.checked ? 'status-badge enabled' : 'status-badge disabled';
            });
        });
        
        // 加载设置
        async function loadSchedules() {
            try {
                const response = await fetch('/api/network/schedule');
                const data = await response.json();
                
                if (data.success) {
                    data.data.forEach(task => {
                        if (task.task_type === 'quick') loadQuick(task);
                        if (task.task_type === 'full') loadFull(task);
                    });
                }
            } catch (error) {
                alert('加载失败: ' + error.message);
            }
        }
        
        // 加载快速扫描
        function loadQuick(task) {
            document.getElementById('quickEnabled').checked = task.enabled;
            document.getElementById('quickStatus').textContent = task.enabled ? '启用' : '禁用';
            document.getElementById('quickStatus').className = task.enabled ? 'status-badge enabled' : 'status-badge disabled';
            
            if (task.schedule_expr) {
                const parts = task.schedule_expr.split(' ');
                if (parts.length === 5) {
                    document.getElementById('quickMinute').value = parts[0];
                    document.getElementById('quickHour').value = parts[1];
                    document.getElementById('quickDay').value = parts[2];
                    document.getElementById('quickMonth').value = parts[3];
                    document.getElementById('quickWeekday').value = parts[4];
                    updateCron('quick');
                }
            }
            
            if (task.schedule_tz) document.getElementById('quickTz').value = task.schedule_tz;
            if (task.description) document.getElementById('quickDesc').value = task.description;
            if (task.next_execution) document.getElementById('quickNext').textContent = task.next_execution;
        }
        
        // 加载完整扫描
        function loadFull(task) {
            document.getElementById('fullEnabled').checked = task.enabled;
            document.getElementById('fullStatus').textContent = task.enabled ? '启用' : '禁用';
            document.getElementById('fullStatus').className = task.enabled ? 'status-badge enabled' : 'status-badge disabled';
            
            if (task.schedule_expr) {
                const parts = task.schedule_expr.split(' ');
                if (parts.length === 5) {
                    document.getElementById('fullMinute').value = parts[0];
                    document.getElementById('fullHour').value = parts[1];
                    document.getElementById('fullDay').value = parts[2];
                    document.getElementById('fullMonth').value = parts[3];
                    document.getElementById('fullWeekday').value = parts[4];
                    updateCron('full');
                }
            }
            
            if (task.schedule_tz) document.getElementById('fullTz').value = task.schedule_tz;
            if (task.description) document.getElementById('fullDesc').value = task.description;
            if (task.next_execution) document.getElementById('fullNext').textContent = task.next_execution;
        }
        
        // 更新Cron表达式
        function updateCron(type) {
            const minute = document.getElementById(type + 'Minute').value || '*';
            const hour = document.getElementById(type + 'Hour').value || '*';
            const day = document.getElementById(type + 'Day').value || '*';
            const month = document.getElementById(type + 'Month').value || '*';
            const weekday = document.getElementById(type + 'Weekday').value || '*';
            
            const cron = `${minute} ${hour} ${day} ${month} ${weekday}`;
            document.getElementById(type + 'Cron').value = cron;
        }
        
        // 设置预设
        function setQuickPreset(cron) {
            const parts = cron.split(' ');
            if (parts.length === 5) {
                document.getElementById('quickMinute').value = parts[0];
                document.getElementById('quickHour').value = parts[1];
                document.getElementById('quickDay').value = parts[2];
                document.getElementById('quickMonth').value = parts[3];
                document.getElementById('quickWeekday').value = parts[4];
                updateCron('quick');
            }
        }
        
        function setFullPreset(cron) {
            const parts = cron.split(' ');
            if (parts.length === 5) {
                document.getElementById('fullMinute').value = parts[0];
                document.getElementById('fullHour').value =
